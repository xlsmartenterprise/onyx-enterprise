# Install the pinned External Secrets Operator before applying these objects.
# Controller KSA external-secrets/external-secrets is linked to the dedicated
# Terraform GSA. Its four per-secret IAM grants are scoped to this environment.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onyx-gcpsm
  namespace: onyx
spec:
  provider:
    gcpsm:
      projectID: internal-tech-tools-enterprise
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onyx-postgresql
  namespace: onyx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onyx-gcpsm
  target:
    name: onyx-postgresql
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: onyx
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: onyx-staging-postgres-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onyx-redis
  namespace: onyx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onyx-gcpsm
  target:
    name: onyx-redis
    creationPolicy: Owner
  data:
    - secretKey: redis_password
      remoteRef:
        key: onyx-staging-redis-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onyx-opensearch
  namespace: onyx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onyx-gcpsm
  target:
    name: onyx-opensearch
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        opensearch_admin_username: admin
        opensearch_admin_password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: onyx-staging-opensearch-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onyx-userauth
  namespace: onyx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onyx-gcpsm
  target:
    name: onyx-userauth
    creationPolicy: Owner
  data:
    - secretKey: user_auth_secret
      remoteRef:
        key: onyx-staging-user-auth-secret
