# Submit the current reviewed checkout with _REGISTRY and _TAG set to the
# target Artifact Registry repository and immutable Git commit SHA.
# Only the frontend and API/worker images are built; Vertex AI serves models.
steps:
  - name: gcr.io/cloud-builders/docker
    id: web
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file=web/Dockerfile
      - --build-arg=NEXT_PUBLIC_APP_NAME=XLSMART Enterprise
      - --tag=${_REGISTRY}/web-server:${_TAG}
      - web
  - name: gcr.io/cloud-builders/docker
    id: backend
    args:
      - build
      - --file=backend/Dockerfile
      - --tag=${_REGISTRY}/backend:${_TAG}
      - backend
images:
  - ${_REGISTRY}/web-server:${_TAG}
  - ${_REGISTRY}/backend:${_TAG}
timeout: 7200s
options:
  machineType: E2_HIGHCPU_32
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY
